# Secret scanning (docs/decisions/0009). Runs in CI on every push and pull request, and locally with
# `bun run check:secrets`. The default rules apply; additions belong here with a reason.
title = "file-transfer"

[extend]
useDefault = true

# Parcel v1 test vectors publish keys derived from the fixed, public secret 00 01 .. 1f on purpose:
# other implementations need them to check their key derivation. Only this exact file is exempt.
[allowlist]
description = "public parcel test vectors"
paths = ['''^libraries/parcel/test/vectors/vectors\.json$''']
