name: checks

# Checks every pull request and every push to main; deploys after the checks pass:
# - a pull request from a branch of this repository gets a Worker Preview (`pr-<number>`), commented on the pull request
#   and verified end to end, updated on every push and destroyed when the pull request closes;
# - a push to main deploys production (https://send.phibkro.org) and verifies it end to end.
# Pull requests from forks and from Dependabot never receive the deploy secrets (GitHub withholds them) and are only
# checked.
# Deploy jobs run only when the repository variable DEPLOYMENTS is "enabled" (platforms/cloudflare/README.md, CI).

on:
  # Pushes to main only. A pull request's own run checks its branch; a second run per push would report every job twice
  # on the same commit, and the push run's skipped jobs (changesets, preview, the artifacts caller) would stand in for
  # the real ones in main's required checks.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # Vite+ check (format, lint, types), module graph, Effect profile (effx), tests (Vitest).
      - run: bun run check
      # Independent re-implementation of parcel v1 (Python, OpenSSL) must reproduce every test vector byte.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install cryptography==50.0.1 && bun run check:vectors
      # The Worker and its Durable Objects under wrangler dev: rooms, relaying, and the operator's limits.
      - run: bun run integration
        working-directory: platforms/cloudflare
      # The same check on plain workerd: the self-hosted platform (platforms/self-hosted/workerd.capnp).
      - run: bun run integration
        working-directory: platforms/self-hosted

  secrets:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Reads .gitleaks.toml from the repository root.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  browsers:
    needs: [check]
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    # WebKit on Linux is not Safari, and its storage support lags (docs/spikes/0002-transfer-measurements.md); its
    # result is informational until a real iPhone confirms the save path.
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web
      # The standard suite against wrangler dev (Worker, Durable Object and assets), both sides in this browser.
      - run: bun run e2e
        working-directory: apps/web
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          E2E_TRACE_DIRECTORY: ${{ runner.temp }}/traces
      # The suite stops at its first failed check and keeps Playwright traces of the last pages it closed, so a failure
      # can be replayed with `bunx playwright show-trace <zip>`. The pages hold only the suite's synthetic files.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-traces-${{ matrix.browser }}
          path: ${{ runner.temp }}/traces
          retention-days: 7
          if-no-files-found: ignore

  changesets:
    # Every pull request adds a changeset naming each package it changes, with a semantic version bump, or an empty
    # one when it ships nothing (docs/versioning.md). Releases are written from them (release.yml).
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check:changesets
        env:
          CHANGESET_BASE: origin/${{ github.base_ref }}
          CHANGESET_AUTHOR: ${{ github.event.pull_request.user.login }}

  artifacts:
    # The node executables on every platform and the web client, built and smoke-tested the way a release builds them.
    needs: [check]
    if: github.event.action != 'closed' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/artifacts.yml
    with:
      label: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}

  container:
    needs: [check]
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: docker/setup-buildx-action@v4
      # The runner's architecture, loaded for the tests below; main also publishes amd64 and arm64 (Dockerfile).
      - name: Build the self-hosted image
        run: docker buildx build --platform linux/amd64 --load -f platforms/self-hosted/Dockerfile -t file-transfer:ci .
      - name: Start it
        run: docker run -d --name file-transfer -p 8080:8080 file-transfer:ci
      - name: Wait until it answers
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/instance; then exit 0; fi
            sleep 2
          done
          docker logs file-transfer
          exit 1
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      # The whole end-to-end suite against the container, as against production.
      - run: bun run e2e
        working-directory: apps/web
        env:
          BASE_URL: http://127.0.0.1:8080
      # The arm64 image builds without emulation (Dockerfile); a release also starts it on an arm64 machine.
      - name: Build the arm64 image
        if: github.event_name == 'pull_request'
        run: docker buildx build --platform linux/arm64 -f platforms/self-hosted/Dockerfile .
      - name: Publish to GitHub's container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository }}"
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -f platforms/self-hosted/Dockerfile -t "$image:latest" -t "$image:${{ github.sha }}" .

  deploy-bundle:
    # The prebuilt bundle the Deploy to Cloudflare button deploys, on the `deploy` branch (scripts/deployBundle.ts).
    needs: [check, secrets, browsers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-bundle
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:all && bun scripts/deployBundle.ts "$RUNNER_TEMP/bundle"
        working-directory: platforms/cloudflare
      - name: Publish the bundle to the deploy branch
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/bundle"
          git init -q -b deploy
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy bundle built from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" deploy

  preview:
    needs: [check, secrets]
    if: vars.DEPLOYMENTS == 'enabled' && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - id: deploy
        working-directory: platforms/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun run preview "pr-${{ github.event.pull_request.number }}" --yes 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url="$(grep -oE 'https://[a-z0-9.-]+\.(send\.phibkro\.org|workers\.dev)' "$RUNNER_TEMP/deploy.log" | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # The zone answers GitHub's runners with 403 (see the production job), so checks use the workers.dev address.
          check_url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | tail -n 1)"
          echo "check_url=${check_url:-$url}" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none \
            --body "Preview: $PREVIEW_URL (commit $COMMIT). The end-to-end check runs against it next."
      - name: Wait until the Preview answers
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.check_url }}
        run: |
          for attempt in $(seq 1 24); do
            status="$(curl -s -o /dev/null -w '%{http_code}' "$PREVIEW_URL/r/aaaaaaaaaaaaaaaaaaaaaa")"
            echo "attempt $attempt: $status"
            if [ "$status" = 200 ]; then exit 0; fi
            sleep 5
          done
          exit 1
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run e2e
        working-directory: apps/web
        env:
          BASE_URL: ${{ steps.deploy.outputs.check_url }}

  preview-cleanup:
    if: vars.DEPLOYMENTS == 'enabled' && github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - working-directory: platforms/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run destroy:preview "pr-${{ github.event.pull_request.number }}" --yes

  production:
    needs: [check, secrets]
    if: vars.DEPLOYMENTS == 'enabled' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://send.phibkro.org
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - id: deploy
        working-directory: platforms/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional Worker secrets (alchemy.run.ts): set them as repository secrets to keep them across deploys.
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ADDRESS_SALT: ${{ secrets.ADDRESS_SALT }}
        run: |
          bun run deploy --yes 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # The end-to-end check runs against the deployed Worker's workers.dev address: the zone's security settings on
      # send.phibkro.org answer GitHub's runners (datacenter addresses) with 403, which says nothing about the deploy.
      - name: Wait until the deployed Worker answers
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in $(seq 1 24); do
            status="$(curl -s -o /dev/null -w '%{http_code}' "$WORKER_URL/r/aaaaaaaaaaaaaaaaaaaaaa")"
            echo "attempt $attempt: $status"
            if [ "$status" = 200 ]; then exit 0; fi
            sleep 5
          done
          exit 1
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run e2e
        working-directory: apps/web
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
      # Reported, not required: shows what the zone answers a datacenter address (see above), with the headers that
      # name the security feature (cf-mitigated) when it is blocked.
      - name: Check the production domain
        continue-on-error: true
        run: |
          curl -s -D - -o "$RUNNER_TEMP/body" https://send.phibkro.org/r/aaaaaaaaaaaaaaaaaaaaaa | grep -iE '^(HTTP|cf-|server|content-type)'
          head -c 600 "$RUNNER_TEMP/body"; echo
          test "$(curl -s -o /dev/null -w '%{http_code}' https://send.phibkro.org/r/aaaaaaaaaaaaaaaaaaaaaa)" = 200
