name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # Vite+ check (format, lint, types), module graph, Effect profile (effx), tests (Vitest).
      - run: bun run check
      # Independent re-implementation of format v1 (Python, OpenSSL) must reproduce every test vector byte.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install cryptography==50.0.1 && bun run check:vectors

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Reads .gitleaks.toml from the repository root.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
