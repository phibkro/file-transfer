name: release

# Releases from main, automatically (docs/versioning.md, docs/decisions/0023). When `checks` passes on a push to main
# and changesets are waiting in .changeset/, this:
#   1. runs `changeset version`, which bumps each named package by its declared semantic version and writes its
#      CHANGELOG.md, refreshes bun.lock (which records each workspace's version), then gathers the release notes into the root CHANGELOG.md (tools/quality/src/prepareRelease.ts);
#   2. commits that as "Release vX.Y.Z" on main and tags it: `vX.Y.Z` for the product (apps, platforms and services
#      share one version) and `<package>@<version>` for every package bumped, libraries included;
#   3. pushes the commit and the tags; the `vX.Y.Z` tag's push starts publish.yml, which builds what the tag points to
#      and publishes the GitHub release. Publishing from the tag's own push means no workflow here checks out a commit
#      it was handed as an input (CodeQL actions/cache-poisoning).
# A push to main with no changesets waiting (or only empty ones) releases nothing. Started by hand, it does the same
# for main's current commit.
#
# Main is protected by a ruleset (pull requests and passing checks), which the workflow's own token cannot bypass, so
# the release commit and tags are pushed with a deploy key that is on the ruleset's bypass list. Its private key is the
# secret RELEASE_DEPLOY_KEY of the `release` environment, which only main may use, so no pull request can read it
# (docs/versioning.md, Release key). Unlike the workflow's token, a deploy key's push starts `checks`, so the release
# commit is checked and deployed like any other; its own release run finds no changesets and stops.

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pending:
    # Whether there is anything to release, decided without the release environment, so the many pushes to main that
    # release nothing never touch the key or wait for the environment's reviewers.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.current.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Release only the commit the checks passed on, when changesets wait
        id: current
        env:
          CHECKED: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$CHECKED" ] && [ "$(git rev-parse HEAD)" != "$CHECKED" ]; then
            echo "main moved on since the checked commit; the run for the newer commit releases it"
          elif [ -z "$(find .changeset -name '*.md' ! -name README.md -print -quit)" ]; then
            echo "no changesets waiting; nothing to release"
          else
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  version:
    needs: [pending]
    if: needs.pending.outputs.commit != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # Pushes go over SSH with this key (see the comment at the top); without it the push to main is refused.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Check the key and the commit
        id: current
        env:
          PENDING: ${{ needs.pending.outputs.commit }}
          HAS_KEY: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::error::the release environment has no RELEASE_DEPLOY_KEY secret, so the release cannot be pushed to main (docs/versioning.md, Release key)"
            exit 1
          elif [ "$(git rev-parse HEAD)" != "$PENDING" ]; then
            echo "main moved on while waiting; the run for the newer commit releases it"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.current.outputs.skip != 'true'
      - uses: actions/setup-node@v7
        if: steps.current.outputs.skip != 'true'
        with:
          node-version: 22
      - if: steps.current.outputs.skip != 'true'
        run: bun install --frozen-lockfile
      - name: Bump versions and write changelogs
        id: prepare
        if: steps.current.outputs.skip != 'true'
        run: |
          bunx changeset version
          # Changesets bumps the manifests but not bun.lock, which records each workspace's version; refresh it so the
          # release commit leaves nothing for the next install to rewrite (tools/quality/test/lockfile.test.ts).
          bun install --lockfile-only
          bun run release:prepare "$RUNNER_TEMP/notes.md" | tee "$RUNNER_TEMP/prepare.txt"
          grep -E '^(version|tags)=' "$RUNNER_TEMP/prepare.txt" >> "$GITHUB_OUTPUT"
          # Changesets writes the changelogs unformatted; the repository's formatter is the one that checks them.
          ./node_modules/.bin/vp fmt CHANGELOG.md '**/CHANGELOG.md'
      - name: Commit and tag the release
        if: steps.current.outputs.skip != 'true' && steps.prepare.outputs.tags != ''
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          TAGS: ${{ steps.prepare.outputs.tags }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          title="Release libraries"
          if [ -n "$VERSION" ]; then title="Release v$VERSION"; fi
          git commit -q -m "$title" -m "Versions and changelogs from the changesets merged since the last release (docs/versioning.md)."
          for tag in $TAGS; do git tag -a "$tag" -m "$tag"; done
          git push origin HEAD:main
          # GitHub creates no push events for tags when more than three are pushed at once, so the product tag, whose
          # push starts publish.yml, goes on its own after the library tags.
          product=""
          libraries=""
          for tag in $TAGS; do
            case "$tag" in
              v*) product="$tag" ;;
              *) libraries="$libraries $tag" ;;
            esac
          done
          if [ -n "$libraries" ]; then git push origin $libraries; fi
          if [ -n "$product" ]; then git push origin "$product"; fi
