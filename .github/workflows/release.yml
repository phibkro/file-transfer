name: release

# Publishes a release when a version tag is pushed (`git tag v0.1.0 && git push origin v0.1.0`), or builds everything
# without publishing when started by hand (docs/decisions/0021):
#   - the server node as one executable per platform (platforms/self-hosted/scripts/nodeConfig.ts, `workerd compile`),
#     each smoke-tested on its own platform;
#   - the container image for linux/amd64 and linux/arm64, tagged with the version;
#   - the web client's static build.
# `workerd compile` attaches the configuration to the workerd binary that runs it, so each executable is built on a
# runner of its own platform.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: macos-latest, platform: macos-arm64 }
          - { runner: windows-latest, platform: windows-x64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run compile
        working-directory: platforms/self-hosted
      # Apple silicon runs only signed code, and attaching the configuration invalidates workerd's signature.
      - name: Sign it ad hoc (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - platforms/self-hosted/dist/file-transfer-node
      - name: Name the executable for its platform
        working-directory: platforms/self-hosted
        run: |
          binary="file-transfer-node"
          if [ "${{ matrix.platform }}" = windows-x64 ]; then binary="file-transfer-node.exe"; fi
          mkdir -p package
          mv dist/file-transfer-node "package/$binary"
          chmod +x "package/$binary"
          echo "BINARY=package/$binary" >> "$GITHUB_ENV"
      - run: bun scripts/smokeNode.ts "$BINARY"
        working-directory: platforms/self-hosted
      - name: Package it
        working-directory: platforms/self-hosted
        run: |
          name="file-transfer-node-${GITHUB_REF_NAME//\//-}-${{ matrix.platform }}"
          cp ../../LICENSE package/LICENSE
          cp node-README.md package/README.md
          mkdir -p "$RUNNER_TEMP/out"
          if [ "${{ matrix.platform }}" = windows-x64 ]; then
            (cd package && 7z a -tzip "$RUNNER_TEMP/out/$name.zip" . > /dev/null)
          else
            tar -czf "$RUNNER_TEMP/out/$name.tar.gz" -C package .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.platform }}
          path: ${{ runner.temp }}/out/*

  web-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/web
      - name: Package it
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          tar -czf "$RUNNER_TEMP/out/file-transfer-web-${GITHUB_REF_NAME//\//-}.tar.gz" -C apps/web/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web-client
          path: ${{ runner.temp }}/out/*

  container:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish for amd64 and arm64
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository }}"
          version="${GITHUB_REF_NAME#v}"
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -f platforms/self-hosted/Dockerfile -t "$image:$version" -t "$image:${version%.*}" .

  container-arm64:
    # The arm64 image, started on an arm64 machine: the build above made it without running it.
    needs: [container]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Start the published image and ask it something
        run: |
          image="ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}"
          docker run -d --name node -p 8080:8080 "$image"
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/instance; then exit 0; fi
            sleep 2
          done
          docker logs node
          exit 1

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [node, web-client, container-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --generate-notes \
            --title "$GITHUB_REF_NAME" out/*
